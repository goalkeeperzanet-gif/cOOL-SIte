<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RateLab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#09090b;color:#f4f4f5;min-height:100vh}
.wrap{max-width:920px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:26px;font-weight:850;letter-spacing:-1px}.brand span{color:#a78bfa}.tabs{display:flex;gap:6px;background:#18181b;padding:5px;border-radius:14px}.tabs button,.filter{border:0;background:transparent;color:#a1a1aa;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.tabs button.active,.filter.active{background:#27272a;color:white}
.panel{background:linear-gradient(145deg,#18181b,#111113);border:1px solid #27272a;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0005}.hero{font-size:42px;letter-spacing:-2px;margin:0 0 8px}.muted{color:#a1a1aa}.field{margin:22px 0}.field label{display:block;font-size:13px;color:#a1a1aa;margin-bottom:8px;font-weight:750}.input{width:100%;background:#09090b;border:1px solid #3f3f46;color:white;padding:15px;border-radius:13px;font-size:16px;outline:none}.input:focus{border-color:#a78bfa}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.score{background:#09090b;border:1px solid #27272a;border-radius:16px;padding:15px}.score input{width:100%;accent-color:#a78bfa}.num{font-size:26px;font-weight:850}.save{width:100%;margin-top:22px;border:0;border-radius:14px;padding:15px;background:#a78bfa;color:#18181b;font-weight:900;font-size:16px;cursor:pointer}.save:hover{filter:brightness(1.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;background:#18181b;border:1px solid #27272a;border-radius:16px}.stat b{font-size:25px;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.history{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;background:#18181b;border:1px solid #27272a;padding:17px;border-radius:16px}.item b{font-size:16px}.rating{font-weight:900;color:#c4b5fd;font-size:20px}.small{font-size:12px;color:#71717a;margin-top:4px}.empty{text-align:center;padding:55px;color:#71717a}
@media(max-width:650px){.hero{font-size:34px}.scores{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">Rate<span>Lab</span></div><div class="tabs"><button id="newTab" class="active">Rate</button><button id="histTab">History</button></div></div>
<section id="rateView" class="panel"><h1 class="hero">Rate anything.</h1><div class="muted">Build your own personal rankings. Everything stays on this device.</div>
<div class="field"><label>WHAT ARE YOU RATING?</label><input id="name" class="input" placeholder="e.g. Minecraft, AirPods, a movie..."></div>
<div class="scores" id="scores"></div><button class="save" id="save">Save rating</button></section>
<section id="historyView" style="display:none"><div class="stats"><div class="stat"><span class="muted">Ratings</span><b id="count">0</b></div><div class="stat"><span class="muted">Average</span><b id="avg">—</b></div><div class="stat"><span class="muted">Top score</span><b id="top">—</b></div></div>
<div class="controls"><button class="filter active" data-sort="new">Newest</button><button class="filter" data-sort="old">Oldest</button><button class="filter" data-sort="high">Highest rated</button><button class="filter" data-sort="low">Lowest rated</button></div><div id="history" class="history"></div></section>
</div><script>
const KEY="ratelab-v1", dims=["Fun","Quality","Value","Design"];let data=JSON.parse(localStorage.getItem(KEY)||"[]"),sort="new";
const scores=document.querySelector("#scores");dims.forEach((d,i)=>scores.insertAdjacentHTML("beforeend",`<div class="score"><label>${d}</label><input id="s${i}" type="range" min="0" max="100" value="80"><div class="num" id="n${i}">80</div></div>`));
dims.forEach((d,i)=>document.querySelector("#s"+i).oninput=e=>document.querySelector("#n"+i).textContent=e.target.value);
function render(){let arr=[...data];arr.sort((a,b)=>sort==="new"?b.t-a.t:sort==="old"?a.t-b.t:sort==="high"?b.r-a.r:a.r-b.r);document.querySelector("#count").textContent=data.length;document.querySelector("#avg").textContent=data.length?(data.reduce((x,y)=>x+y.r,0)/data.length).toFixed(1):"—";document.querySelector("#top").textContent=data.length?Math.max(...data.map(x=>x.r)):"—";let h=document.querySelector("#history");h.innerHTML=arr.length?arr.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="small">${new Date(x.t).toLocaleDateString()} · ${x.breakdown.join(" / ")}</div></div><div class="rating">${x.r}/100</div></div>`).join(""):`<div class="empty">No ratings yet.<br>Go rate something.</div>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
document.querySelector("#save").onclick=()=>{let name=document.querySelector("#name").value.trim();if(!name)return alert("Give it a name first.");let b=dims.map((_,i)=>+document.querySelector("#s"+i).value),r=Math.round(b.reduce((a,v)=>a+v,0)/4);data.push({name,r,breakdown:b,t:Date.now()});localStorage.setItem(KEY,JSON.stringify(data));document.querySelector("#name").value="";alert("Saved.");render()};
document.querySelector("#newTab").onclick=()=>{rateView.style.display="block";historyView.style.display="none";newTab.classList.add("active");histTab.classList.remove("active")};
document.querySelector("#histTab").onclick=()=>{rateView.style.display="none";historyView.style.display="block";histTab.classList.add("active");newTab.classList.remove("active");render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");sort=b.dataset.sort;render()});render();
</script></body></html>
